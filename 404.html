<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Halaman Tidak Ditemukan - Peta Pusat Perbelanjaan Indonesia</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  body {
    font-family: 'Inter', sans-serif;
    background: linear-gradient(135deg, #0f172a, #1e293b);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    color: white;
  }

  .error-container {
    text-align: center;
    max-width: 600px;
    padding: 40px;
    background: rgba(255, 255, 255, 0.05);
    border-radius: 24px;
    backdrop-filter: blur(10px);
    border: 1px solid rgba(255, 255, 255, 0.1);
    animation: fadeIn 0.6s ease;
  }

  @keyframes fadeIn {
    from {
      opacity: 0;
      transform: translateY(30px);
    }
    to {
      opacity: 1;
      transform: translateY(0);
    }
  }

  .error-code {
    font-family: 'Space Grotesk', sans-serif;
    font-size: 120px;
    font-weight: 700;
    background: linear-gradient(135deg, #facc15, #f97316);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    line-height: 1;
    margin-bottom: 10px;
  }

  .error-title {
    font-size: 28px;
    font-weight: 600;
    margin-bottom: 12px;
    color: #f1f5f9;
  }

  .error-desc {
    font-size: 16px;
    color: #94a3b8;
    margin-bottom: 30px;
    line-height: 1.6;
  }

  .error-actions {
    display: flex;
    gap: 12px;
    justify-content: center;
    flex-wrap: wrap;
  }

  .btn-primary {
    display: inline-block;
    padding: 14px 40px;
    background: linear-gradient(135deg, #facc15, #f97316);
    color: #0f172a;
    text-decoration: none;
    border-radius: 12px;
    font-weight: 600;
    font-size: 16px;
    transition: all 0.3s ease;
    box-shadow: 0 4px 20px rgba(250, 204, 21, 0.3);
  }

  .btn-primary:hover {
    transform: translateY(-2px);
    box-shadow: 0 6px 30px rgba(250, 204, 21, 0.5);
  }

  .btn-secondary {
    display: inline-block;
    padding: 14px 30px;
    background: rgba(255, 255, 255, 0.1);
    color: white;
    text-decoration: none;
    border-radius: 12px;
    font-weight: 500;
    font-size: 16px;
    transition: all 0.3s ease;
    border: 1px solid rgba(255, 255, 255, 0.2);
  }

  .btn-secondary:hover {
    background: rgba(255, 255, 255, 0.2);
  }

  .brand-mark {
    font-family: 'Space Grotesk', sans-serif;
    font-weight: 700;
    font-size: 18px;
    letter-spacing: 2px;
    background: linear-gradient(135deg, #facc15, #f97316);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    display: block;
    margin-bottom: 20px;
  }

  .countdown {
    font-size: 14px;
    color: #64748b;
    margin-top: 20px;
  }

  .countdown span {
    color: #facc15;
    font-weight: 700;
  }

  /* Responsive */
  @media (max-width: 768px) {
    .error-code {
      font-size: 80px;
    }
    .error-title {
      font-size: 22px;
    }
    .error-actions {
      flex-direction: column;
      align-items: center;
    }
    .btn-primary, .btn-secondary {
      width: 100%;
      text-align: center;
    }
  }
</style>
</head>
<body>

<div class="error-container">
  <div class="brand-mark">PETA</div>
  <div class="error-code">404</div>
  <h1 class="error-title">Halaman Tidak Ditemukan</h1>
  <p class="error-desc">
    Maaf, halaman yang Anda cari tidak tersedia atau telah dipindahkan.<br>
    Jangan khawatir, Anda akan diarahkan kembali ke halaman utama.
  </p>
  <div class="error-actions">
    <a href="index.html" class="btn-primary">← Kembali ke Peta</a>
    <a href="javascript:history.back()" class="btn-secondary">Kembali Sebelumnya</a>
  </div>
  <div class="countdown">
    Mengalihkan secara otomatis dalam <span id="timer">5</span> detik...
  </div>
</div>

<script>
// ============================================================
// AUTO REDIRECT KE INDEX.HTML SETELAH 5 DETIK
// ============================================================
let countdown = 5;
const timerElement = document.getElementById('timer');

const interval = setInterval(() => {
  countdown--;
  timerElement.textContent = countdown;
  
  if (countdown <= 0) {
    clearInterval(interval);
    window.location.href = 'index.html';
  }
}, 1000);

// Jika pengguna mengklik tombol, batalkan auto-redirect
document.querySelectorAll('.btn-primary, .btn-secondary').forEach(btn => {
  btn.addEventListener('click', () => {
    clearInterval(interval);
  });
});
</script>

</body>
</html>
