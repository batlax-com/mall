<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Direktori Lokasi - Peta Pusat Perbelanjaan Indonesia</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="direktori.css">
<style>
/* ============================================================
   TOMBOL KEMBALI KE ATAS (FLOATING)
   ============================================================ */
#backToTop {
  position: fixed;
  bottom: 30px;
  right: 30px;
  width: 55px;
  height: 55px;
  background: linear-gradient(135deg, #facc15, #f97316);
  color: #0f172a;
  border: none;
  border-radius: 50%;
  font-size: 28px;
  font-weight: 700;
  cursor: pointer;
  box-shadow: 0 6px 20px rgba(250, 204, 21, 0.4);
  transition: all 0.3s ease;
  z-index: 999;
  display: flex;
  align-items: center;
  justify-content: center;
  opacity: 0;
  visibility: hidden;
  transform: translateY(20px);
}

#backToTop:hover {
  transform: translateY(-3px) scale(1.05);
  box-shadow: 0 8px 30px rgba(250, 204, 21, 0.6);
}

#backToTop.show {
  opacity: 1;
  visibility: visible;
  transform: translateY(0);
}

#backToTop:active {
  transform: scale(0.9);
}

/* Responsive */
@media (max-width: 768px) {
  #backToTop {
    width: 48px;
    height: 48px;
    font-size: 22px;
    bottom: 20px;
    right: 20px;
  }
}

/* Animasi panah */
#backToTop .arrow {
  display: inline-block;
  transition: transform 0.3s ease;
}

#backToTop:hover .arrow {
  transform: translateY(-3px);
}
</style>
</head>
<body class="direktori-body">

<header class="topbar">
  <div class="brand">
    <span class="brand-mark">PETA</span>
    <span class="brand-sub">Pusat Perbelanjaan Indonesia</span>
  </div>
  <a href="index.html" class="nav-link">← Lihat Peta</a>
</header>

<div class="direktori-wrap">

  <div class="direktori-intro">
    <h1>Direktori Lokasi</h1>
    <p>Daftar lengkap seluruh mall, pasar, swalayan, dan pusat perbelanjaan yang tercatat, dikelompokkan per kategori dan per provinsi.</p>
    <input type="text" id="direktoriSearch" placeholder="Cari nama lokasi, kota, atau provinsi...">
  </div>

  <nav class="direktori-jumpnav" id="jumpNav">
    <!-- diisi otomatis oleh direktori.js: tombol lompat per kategori -->
  </nav>

  <div id="direktoriContent" class="direktori-content">
    <!-- diisi otomatis oleh direktori.js -->
    <p class="direktori-loading">Memuat data...</p>
  </div>

</div>

<!-- ============================================================
     TOMBOL KEMBALI KE ATAS
     ============================================================ -->
<button id="backToTop" aria-label="Kembali ke atas">
  <span class="arrow">↑</span>
</button>

<script>
// ============================================================
// LOGIKA TOMBOL KEMBALI KE ATAS
// ============================================================
document.addEventListener('DOMContentLoaded', function() {
  const backToTopBtn = document.getElementById('backToTop');

  // Tampilkan/sembunyikan tombol berdasarkan scroll
  window.addEventListener('scroll', function() {
    if (window.scrollY > 300) {
      backToTopBtn.classList.add('show');
    } else {
      backToTopBtn.classList.remove('show');
    }
  });

  // Fungsi kembali ke atas dengan animasi halus
  backToTopBtn.addEventListener('click', function() {
    window.scrollTo({
      top: 0,
      behavior: 'smooth'
    });
  });
});
</script>

<script src="direktori.js"></script>
</body>
</html>
